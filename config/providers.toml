# Escolha de implementação por função (ADR 006). Trocar de abordagem = mudar uma linha aqui.
# Sem segredos: chaves e tokens ficam só no .env (§2.7). As variáveis do .env listadas no
# CLAUDE.md §3 têm prioridade sobre os valores deste arquivo.

[providers]
text = "ollama"
tts = "kokoro"        # rascunhos e prévias de revisão: local, sem limite
tts_final = "gemini"  # vídeo final e vídeo-régua: Charon, várias cenas por chamada (ADR 012, proposta)
image_gen = "workers_ai"
archives = ["wikimedia_commons", "library_of_congress", "flickr_commons", "pexels", "pixabay", "unsplash"]  # ordem da cascata (§8)
aligner = "ffprobe"
# Motor por formato do episódio (ADR 001). O MVP só produz archival_documentary.
render = { archival_documentary = "ffmpeg", explainer = "remotion" }  # remotion: etapa 43
store = "json_files"
review = "json_files"

[ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen3.5:9b"  # provisório até o benchmark (etapa 5)
num_thread = 8        # núcleos físicos; 12 threads derruba o desempenho (ADR 004)

[kokoro]
voices = { en = "am_michael", "pt-BR" = "pm_alex" }  # voz por idioma (ADR 008)
num_threads = 8
chars_per_second = 15.0  # ritmo medido com pm_alex; o vp check estima a cena com ele
pause_ms = 300           # silêncio extra por <short pause>; com o do Kokoro nas pontas dá ~0,7 s (ADR 015)

[gemini_tts]
model = "gemini-3.8-flash-tts"
voices = { "pt-BR" = "Charon", "en" = "Charon" }
styles = { "pt-BR" = "narração de documentário em português do Brasil, com sotaque brasileiro; tom calmo, informativo e neutro; ritmo moderado", "en" = "documentary narration in American English; calm, informative and neutral tone; moderate pace" }
requests_per_minute = 3  # camada gratuita (erro 429 em 2026-09-29)
chars_per_second = 13.0  # Charon: 12 a 14 caracteres por segundo no teste

[workers_ai]
model = "@cf/black-forest-labs/flux-1-schnell"

[ffmpeg]
crf = 20
preset_final = "medium"      # 1080p final
preset_preview = "veryfast"  # prévia 720p
zoom = 0.06                  # zoom lento de 1,00 a 1,06 por cena
fade_s = 0.3                 # fade de entrada e saída dentro de cada cena
burn_captions_preview = true
burn_captions_final = false  # no final, captions.srt sobe separado no YouTube

[limits]
max_generated_images_per_episode = 12
max_candidates_per_scene = 2
max_cloud_requests_per_episode = 40

[budget]
max_api_spend_usd = 0
allow_paid_api = false
