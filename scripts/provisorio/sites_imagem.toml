# Sites de imagem que o imagens_navegador.py sabe operar. Um bloco por site; trocar de site é `--site NOME`.
#
# ATENÇÃO: os seletores abaixo são um ponto de partida NÃO CONFERIDO contra a página real (escritos em
# 2026-11-11 sem acesso à tela logada). Antes da primeira rodada: `imagens_navegador.py mapear <site>`,
# que lista o que cada seletor encontra e os botões e campos da página, e corrigir aqui. As telas mudam sem
# aviso; quando uma rodada falhar por "não achei", é aqui que se conserta.
#
# Campos:
#   url           página de conversa nova
#   caixa         campo onde o prompt é digitado
#   enviar        botão de enviar (vazio = tecla Enter)
#   preparo       (opcional) cliques feitos antes de tudo, em ordem: por exemplo ligar a ferramenta de imagem
#   anexo         <input type="file"> que recebe as referências (usado quando anexo_botao está vazio)
#   anexo_botao   lista de cliques que abrem o seletor de arquivos do sistema (menu, depois item)
#   imagem        imagens geradas dentro das respostas (a última é a baixada)
#   ocupado       elemento visível enquanto o site ainda está gerando
#   baixar        "img" (lê a imagem mostrada) ou "botao" (clica no botão de download do site)
#   botao_baixar  botão de download, quando baixar = "botao"
#   bloqueio_url  trechos de URL que significam login ou verificação: a rodada para
#   bloqueio_texto  textos visíveis que significam limite, captcha ou recusa de conta: a rodada para

[gemini]
# Conferido na tela logada em 2026-11-11 (pt-BR): caixa, enviar, preparo e anexo_botao.
url = "https://gemini.google.com/app"
caixa = "rich-textarea div[contenteditable='true']"
enviar = "button[aria-label='Enviar mensagem'], button[aria-label='Send message']"
preparo = ["button[aria-label='Envio e ferramentas']", "button[role='menuitemcheckbox']:has-text('Criar imagem')"]
anexo = "input[type='file']"
anexo_botao = ["button[aria-label='Envio e ferramentas']", "[data-test-id='local-images-files-uploader-button']"]
imagem = "model-response img"
ocupado = "button[aria-label*='Interromper'], button[aria-label*='Parar'], button[aria-label*='Stop']"
baixar = "img"
botao_baixar = ""
bloqueio_url = ["accounts.google.com", "/sorry/"]
# "limite será redefinido": aviso no menu de ferramentas quando a cota de geração acaba (visto em 2026-11-15)
bloqueio_texto = ["atingiu o limite", "reached your limit", "limite será redefinido", "não sou um robô", "unusual traffic"]

[chatgpt]
url = "https://chatgpt.com/"
caixa = "#prompt-textarea"
enviar = "button[data-testid='send-button']"
anexo = "input[type='file']"
anexo_botao = []
imagem = "article img"
ocupado = "button[data-testid='stop-button']"
baixar = "img"
botao_baixar = ""
bloqueio_url = ["auth.openai.com", "/auth/login"]
bloqueio_texto = ["atingiu o limite", "reached the limit", "Verify you are human", "Verifique se você é humano"]
