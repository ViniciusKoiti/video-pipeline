[project]
name = "video-pipeline"
version = "0.1.0"
description = "Pipeline local e auditável para vídeos narrados sobre histórias reais (1880–1930)"
readme = "README.md"
# kokoro/misaki 0.9.4 exigem < 3.13 (ADR 004)
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.13,<3",  # MIT — manifestos (§6)
]

[project.optional-dependencies]
# Narração local. Separado para testes e CI não precisarem de ~1,3 GB.
tts = [
    "kokoro==0.9.4",          # Apache-2.0
    "torch>=2.14,<3",         # BSD-3 e outras permissivas; índice só-CPU abaixo
    "soundfile>=0.14,<1",     # BSD-3
    "en_core_web_sm==3.8.0",  # MIT — fixado para o misaki não baixar em tempo de execução
]

[project.scripts]
vp = "app.pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",  # MIT
    "ruff>=0.16,<0.17", # MIT
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.uv]
# O projeto roda só no WSL/Ubuntu (§3); simplifica o lock.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
